[project]
name = "al-mfi-001"
version = "0.2.0"
description = "Malawi Financial & Economic Intelligence Infrastructure — canonical data platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "psycopg-pool>=3.2,<4.0",
  "boto3>=1.35,<2.0",
  "tenacity>=9.0,<10.0",
  "selectolax>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "pyright>=1.1,<2.0",
  "pre-commit>=4.0,<5.0",
]
ingestion = [
  "pymupdf>=1.25,<2.0",
  "pandas>=2.2,<3.0",
]

[project.scripts]
al-mfi-api = "app.main:main"
al-mfi-db-init = "scripts.init_db:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
