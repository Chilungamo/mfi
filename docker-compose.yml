services:
  postgres:
    image: postgres:17
    container_name: al-mfi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: al_mfi
      POSTGRES_USER: al_mfi
      POSTGRES_PASSWORD: al_mfi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U al_mfi -d al_mfi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
